<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="validation.css">
</head>
<body>

  <div class="card">
    <h2>Register</h2>
    <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

    <form id="registerForm" novalidate>

      <div class="input-group">
        <input type="text" name="name" placeholder="Full Name" autocomplete="name">
        <span class="icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        </span>
      </div>

      <div class="input-group">
        <input type="email" name="email" placeholder="Email Address" autocomplete="email">
        <span class="icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        </span>
      </div>

      <div class="input-group">
        <input type="tel" name="phone" placeholder="Phone Number (09XXXXXXXXX)" autocomplete="tel">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2C9.7 21 3 14.3 3 6a2 2 0 0 1 2-2z"/></svg>
        </span>
      </div>

      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password">
        <span class="icon">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
      </div>

      <div class="input-group">
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" autocomplete="new-password">
        <span class="icon">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
      </div>

      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
  <script src="auth.js"></script>
</body>
</html>
